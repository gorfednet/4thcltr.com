# Nginx vhost for 4thcltr.com
# On server: copy to /etc/nginx/vhosts.d/4thcltr.com.conf (or include from main nginx.conf).
#
# Docroot must be the folder that receives `dist/` from deploy (index.html, assets/, robots.txt).
# Default below matches a typical Linux mount: /data/websites/4thcltr.com
#
# After editing: nginx -t && systemctl reload nginx
# SSL cert: certbot certonly --nginx -d 4thcltr.com -d www.4thcltr.com (if using Let's Encrypt)

# HTTP — redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 4thcltr.com www.4thcltr.com;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 4thcltr.com www.4thcltr.com;

    root /data/websites/4thcltr.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/4thcltr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4thcltr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/4thcltr.com.access.log main;
    error_log /var/log/nginx/4thcltr.com.error.log warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; frame-src 'none'; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://api.web3forms.com; upgrade-insecure-requests;" always;

    location = /index.html {
        return 301 https://$host/;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|otf|woff2?|webp|xml|txt|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @spa_fallback;
    }

    location @spa_fallback {
        rewrite ^ /index.html break;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* \.(env|log|key|pem|lock|md|map)$ { deny all; access_log off; log_not_found off; }

    client_max_body_size 10M;
    server_tokens off;
}
